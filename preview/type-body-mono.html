<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div class="col" style="gap:14px">
  <div class="col" style="gap:3px">
    <span class="lbl">Inter · body · 1.6 line-height</span>
    <p style="margin:0;max-width:560px">Implementamos IA agéntica que trabaja con tus sistemas —Slack, CRM, email— para que tu equipo se enfoque en lo que importa.</p>
  </div>
  <div class="col" style="gap:3px">
    <span class="lbl">JetBrains Mono · data · tabular-nums</span>
    <div class="row" style="gap:26px">
      <span class="kpi-value" style="font-size:30px">−62%</span>
      <span class="kpi-value" style="font-size:30px;color:var(--primary)">3.4×</span>
      <span class="mono" style="font-size:15px;color:var(--muted-foreground)">$6,000 / mes · 1741e8</span>
    </div>
  </div>
</div></body></html>
