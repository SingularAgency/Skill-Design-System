<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div class="col" style="gap:12px">
  <div class="col" style="gap:6px"><span class="eyebrow">Website / marketing — dramatic black</span>
  <div class="row" style="gap:8px"><div class="col" style="gap:4px;align-items:center"><div class="swatch" style="width:96px;height:40px;background:#050505"></div><span class="lbl">background #050505</span></div><div class="col" style="gap:4px;align-items:center"><div class="swatch" style="width:96px;height:40px;background:#0a0a0a"></div><span class="lbl">card #0a0a0a</span></div><div class="col" style="gap:4px;align-items:center"><div class="swatch" style="width:96px;height:40px;background:#141414"></div><span class="lbl">muted #141414</span></div><div class="col" style="gap:4px;align-items:center"><div class="swatch" style="width:96px;height:40px;background:#1a1a1a"></div><span class="lbl">accent #1a1a1a</span></div></div></div>
  <div class="col" style="gap:6px"><span class="eyebrow">Web-app / product — tinted navy (dark)</span>
  <div class="row" style="gap:8px"><div class="col" style="gap:4px;align-items:center"><div class="swatch" style="width:96px;height:40px;background:#05060d"></div><span class="lbl">background #05060d</span></div><div class="col" style="gap:4px;align-items:center"><div class="swatch" style="width:96px;height:40px;background:#181d33"></div><span class="lbl">card #181d33</span></div><div class="col" style="gap:4px;align-items:center"><div class="swatch" style="width:96px;height:40px;background:#1a1f36"></div><span class="lbl">muted #1a1f36</span></div><div class="col" style="gap:4px;align-items:center"><div class="swatch" style="width:96px;height:40px;background:#121528"></div><span class="lbl">sidebar #121528</span></div></div></div>
</div></body></html>
