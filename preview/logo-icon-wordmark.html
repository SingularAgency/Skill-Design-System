<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  body{background:#050505}
</style></head><body>
<div class="row" style="gap:30px;align-items:center">
  <div class="col" style="gap:8px;align-items:center"><img src="../assets/logos/singular-icon-dark-bg.svg" alt="" style="height:56px"><span class="lbl">icon · anaglyph mark</span></div>
  <div class="col" style="gap:8px;align-items:center"><img src="../assets/logos/singular-wordmark-dark-bg.svg" alt="Singular" style="height:30px"><span class="lbl">wordmark</span></div>
  <div class="col" style="gap:8px;align-items:center"><span style="width:40px;height:40px;border-radius:12px;background-image:var(--gradient-primary);display:inline-block"></span><span class="lbl">chip · in-app mark</span></div>
</div></body></html>
