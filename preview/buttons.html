<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div class="col" style="gap:14px">
  <div class="row" style="gap:12px">
    <button style="border:0;border-radius:9999px;padding:.6rem 1.2rem;font:600 14px var(--font-display);color:#fff;background-image:var(--gradient-primary);box-shadow:0 2px 6px rgb(0 0 0/.4),inset 0 1px 0 rgb(255 255 255/.2);cursor:pointer">Agendar una llamada →</button>
    <button style="border:1px solid #fff;border-radius:9999px;padding:.6rem 1.2rem;font:600 14px var(--font-display);color:#000;background:#fff;cursor:pointer">Empezar</button>
  </div>
  <div class="row" style="gap:12px">
    <button style="border:1px solid var(--border);border-radius:9999px;padding:.55rem 1.1rem;font:500 14px var(--font-display);color:var(--foreground);background:color-mix(in srgb,#fff 5%,transparent);cursor:pointer">Ver planes</button>
    <button style="border:1px solid color-mix(in srgb,var(--primary) 55%,transparent);border-radius:9999px;padding:.55rem 1.1rem;font:500 14px var(--font-display);color:var(--interactive);background:transparent;cursor:pointer">Outline</button>
    <button style="border:0;border-radius:9999px;padding:.55rem .9rem;font:500 14px var(--font-display);color:var(--muted-foreground);background:transparent;cursor:pointer">Ghost</button>
  </div>
  <span class="lbl">fully rounded · gradient = primary action · white = marketing CTA</span>
</div></body></html>
