<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  @import url("../backgrounds/brand-background.css");
</style></head><body>
<div class="brand-bg" style="height:172px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--border)">
  <div class="brand-bg__stars"></div>
  <div style="position:relative;z-index:1;padding:22px">
    <span class="eyebrow eyebrow--brand">Brand background</span>
    <div style="font-size:22px;font-weight:700;letter-spacing:-.02em;color:#fff;margin-top:6px">mist · grid · stars</div>
    <span class="lbl" style="margin-top:6px;display:block">radial glow (primary+cyan) + 60px grid + drifting stars · reduced-motion safe</span>
  </div>
</div></body></html>
