<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div class="col" style="gap:9px">
  <span class="eyebrow eyebrow--brand">Type scale</span>
  <div class="row" style="align-items:baseline;gap:10px"><span style="font-size:40px;font-weight:700;letter-spacing:-.03em;color:var(--foreground-strong)">Aa</span><span class="lbl">4xl · 40 · hero</span></div>
  <div class="row" style="align-items:baseline;gap:10px"><span style="font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--foreground-strong)">Aa</span><span class="lbl">3xl · 30 · page-title / kpi</span></div>
  <div class="row" style="align-items:baseline;gap:10px"><span style="font-size:24px;font-weight:600;color:var(--foreground-strong)">Aa</span><span class="lbl">2xl · 24</span></div>
  <div class="row" style="align-items:baseline;gap:10px"><span style="font-size:20px;font-weight:600;color:var(--foreground-strong)">Aa</span><span class="lbl">xl · 20 · section-title</span></div>
  <div class="row" style="align-items:baseline;gap:10px"><span style="font-size:14px;font-family:var(--font-body)">Aa</span><span class="lbl">sm · 14 · body (Inter)</span></div>
  <div class="row" style="align-items:baseline;gap:10px"><span style="font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.12em">Eyebrow</span><span class="lbl">2xs · 10 · uppercase .12em</span></div>
</div></body></html>
