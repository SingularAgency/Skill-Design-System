<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div class="col" style="gap:10px"><span class="eyebrow">In-page filters</span>
<div class="row" style="gap:8px">
  <span style="padding:.3rem .8rem;border-radius:9999px;font-size:13px;background:var(--primary);color:#fff">All</span>
  <span style="padding:.3rem .8rem;border-radius:9999px;font-size:13px;border:1px solid var(--border);color:var(--muted-foreground)">Active</span><span style="padding:.3rem .8rem;border-radius:9999px;font-size:13px;border:1px solid var(--border);color:var(--muted-foreground)">In review</span><span style="padding:.3rem .8rem;border-radius:9999px;font-size:13px;border:1px solid var(--border);color:var(--muted-foreground)">Blocked</span><span style="padding:.3rem .8rem;border-radius:9999px;font-size:13px;border:1px solid var(--border);color:var(--muted-foreground)">Done</span>
</div></div></body></html>
