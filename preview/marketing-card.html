<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div style="width:300px;border-radius:16px;background:color-mix(in srgb,#fff 4%,transparent);border:1px solid var(--border);padding:24px">
  <div class="eyebrow eyebrow--brand">Growth · Recomendado</div>
  <div class="kpi-value" style="margin:.5rem 0;font-size:30px">$6,000<span style="font-size:15px;color:var(--muted-foreground);font-weight:400;font-family:var(--font-body)"> /mes</span></div>
  <div style="margin-top:14px;height:42px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;background-image:var(--gradient-primary)">Empezar</div>
</div></body></html>
