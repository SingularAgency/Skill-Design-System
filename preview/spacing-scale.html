<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div class="col" style="gap:10px"><span class="eyebrow eyebrow--brand">Named spacing · --gap-*</span>
<div class="col" style="gap:7px">
  <div class="row" style="gap:12px;align-items:center"><div style="width:4px;height:14px;background-image:var(--gradient-primary);border-radius:3px"></div><span class="lbl">xs · 4px</span></div><div class="row" style="gap:12px;align-items:center"><div style="width:8px;height:14px;background-image:var(--gradient-primary);border-radius:3px"></div><span class="lbl">s · 8px</span></div><div class="row" style="gap:12px;align-items:center"><div style="width:16px;height:14px;background-image:var(--gradient-primary);border-radius:3px"></div><span class="lbl">m · 16px</span></div><div class="row" style="gap:12px;align-items:center"><div style="width:24px;height:14px;background-image:var(--gradient-primary);border-radius:3px"></div><span class="lbl">l · 24px</span></div><div class="row" style="gap:12px;align-items:center"><div style="width:32px;height:14px;background-image:var(--gradient-primary);border-radius:3px"></div><span class="lbl">xl · 32px</span></div>
</div></div></body></html>
