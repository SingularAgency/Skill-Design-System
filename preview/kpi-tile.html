<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div style="width:230px;background:color-mix(in srgb,var(--primary) 8%,#181d33);border:1px solid color-mix(in srgb,var(--primary) 16%,#2a3150);border-radius:12px;padding:18px 20px">
  <div class="row" style="gap:9px"><span class="kpi-value">16</span><span style="font-size:11px;font-weight:600;padding:.12rem .45rem;border-radius:9999px;background:color-mix(in srgb,var(--success) 18%,transparent);color:#86efac">▲ 12%</span></div>
  <div style="font-size:13px;color:var(--muted-foreground);margin-top:8px">Stories en desarrollo activo</div>
</div></body></html>
