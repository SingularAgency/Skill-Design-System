<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div class="col" style="gap:6px">
  <span class="eyebrow eyebrow--brand">Poppins · Display</span>
  <div style="font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1.02;color:var(--foreground-strong)">Tu empresa,<br><span class="text-gradient-brand">potenciada por agentes</span></div>
  <div class="row" style="gap:18px;margin-top:8px">
    <span class="lbl">700 / -0.03em</span><span class="lbl">tracking tight</span><span class="lbl">accent on one phrase</span>
  </div>
</div></body></html>
