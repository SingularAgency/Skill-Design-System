<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div style="border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#181d33">
<table style="width:100%;border-collapse:collapse;font-size:13px;font-family:var(--font-display)">
<thead><tr><th style="text-align:left;padding:.6rem .9rem;color:var(--muted-foreground);font-weight:500;text-transform:uppercase;font-size:10px;letter-spacing:.05em;border-bottom:1px solid var(--border)">Story</th><th style="text-align:left;padding:.6rem .9rem;color:var(--muted-foreground);font-weight:500;text-transform:uppercase;font-size:10px;letter-spacing:.05em;border-bottom:1px solid var(--border)">Owner</th><th style="text-align:left;padding:.6rem .9rem;color:var(--muted-foreground);font-weight:500;text-transform:uppercase;font-size:10px;letter-spacing:.05em;border-bottom:1px solid var(--border)">Status</th><th style="text-align:left;padding:.6rem .9rem;color:var(--muted-foreground);font-weight:500;text-transform:uppercase;font-size:10px;letter-spacing:.05em;border-bottom:1px solid var(--border)">SP</th></tr></thead>
<tbody>
<tr><td style="padding:.65rem .9rem;border-bottom:1px solid var(--border)">Auth refactor</td><td style="padding:.65rem .9rem;border-bottom:1px solid var(--border)"><span style="display:inline-flex;width:1.5rem;height:1.5rem;border-radius:9999px;background:#2E82D6;color:#fff;align-items:center;justify-content:center;font-size:11px;font-weight:600">CA</span></td><td style="padding:.65rem .9rem;border-bottom:1px solid var(--border)"><span style="padding:.12rem .55rem;border-radius:9999px;font-size:11px;background:color-mix(in srgb,var(--info) 18%,transparent);color:#8babff">in-progress</span></td><td style="padding:.65rem .9rem;border-bottom:1px solid var(--border);font-family:var(--font-mono);text-align:right">8</td></tr>
<tr><td style="padding:.65rem .9rem">Billing webhook</td><td style="padding:.65rem .9rem"><span style="display:inline-flex;width:1.5rem;height:1.5rem;border-radius:9999px;background:#9333B1;color:#fff;align-items:center;justify-content:center;font-size:11px;font-weight:600">AL</span></td><td style="padding:.65rem .9rem"><span style="padding:.12rem .55rem;border-radius:9999px;font-size:11px;background:color-mix(in srgb,var(--success) 18%,transparent);color:#86efac">completed</span></td><td style="padding:.65rem .9rem;font-family:var(--font-mono);text-align:right">5</td></tr>
</tbody></table></div></body></html>
