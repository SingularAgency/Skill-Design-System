<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div class="col" style="gap:9px"><span class="eyebrow eyebrow--brand">Radius · base 8px</span>
<div class="row" style="gap:14px;align-items:flex-end">
  <div class="col" style="gap:6px;align-items:center"><div style="width:64px;height:52px;border-radius:6px;background:color-mix(in srgb,var(--primary) 22%,var(--card));border:1px solid var(--border)"></div><span class="lbl">md 6</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:64px;height:52px;border-radius:8px;background:color-mix(in srgb,var(--primary) 22%,var(--card));border:1px solid var(--border)"></div><span class="lbl">lg 8</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:64px;height:52px;border-radius:12px;background:color-mix(in srgb,var(--primary) 22%,var(--card));border:1px solid var(--border)"></div><span class="lbl">xl 12 · app card</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:64px;height:52px;border-radius:16px;background:color-mix(in srgb,var(--primary) 22%,var(--card));border:1px solid var(--border)"></div><span class="lbl">2xl 16 · web card</span></div><div class="col" style="gap:6px;align-items:center"><div style="width:64px;height:52px;border-radius:9999px;background:color-mix(in srgb,var(--primary) 22%,var(--card));border:1px solid var(--border)"></div><span class="lbl">full · pills</span></div>
</div></div></body></html>
