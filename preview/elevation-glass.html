<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div class="row" style="gap:18px;align-items:stretch">
  <div class="col" style="gap:8px"><span class="lbl">floating glass</span>
    <div style="width:150px;height:96px;border-radius:16px;background:color-mix(in srgb,var(--card) 60%,transparent);backdrop-filter:blur(12px);border:1px solid var(--border);box-shadow:0 10px 24px rgb(0 0 0/.5)"></div></div>
  <div class="col" style="gap:8px"><span class="lbl">accent CTA glow</span>
    <div style="width:150px;height:96px;border-radius:16px;background-image:var(--gradient-primary);box-shadow:0 8px 30px -8px color-mix(in srgb,var(--primary) 70%,transparent),inset 0 1px 0 rgb(255 255 255/.25)"></div></div>
  <div class="col" style="gap:8px"><span class="lbl">card hairline</span>
    <div style="width:150px;height:96px;border-radius:16px;background:color-mix(in srgb,#fff 4%,transparent);border:1px solid var(--border)"></div></div>
</div></body></html>
