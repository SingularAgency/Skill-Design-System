<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div class="col" style="gap:10px"><span class="eyebrow">Status badge · glyph + semantic tint</span>
<div class="row" style="gap:10px">
  <span style="display:inline-flex;align-items:center;gap:.35rem;padding:.18rem .6rem;border-radius:9999px;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--info) 18%,transparent);color:color-mix(in srgb,var(--info) 80%,#fff)"><span style="width:6px;height:6px;border-radius:9999px;background:var(--info)"></span>in-progress</span><span style="display:inline-flex;align-items:center;gap:.35rem;padding:.18rem .6rem;border-radius:9999px;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--success) 18%,transparent);color:color-mix(in srgb,var(--success) 80%,#fff)"><span style="width:6px;height:6px;border-radius:9999px;background:var(--success)"></span>completed</span><span style="display:inline-flex;align-items:center;gap:.35rem;padding:.18rem .6rem;border-radius:9999px;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--destructive) 18%,transparent);color:color-mix(in srgb,var(--destructive) 80%,#fff)"><span style="width:6px;height:6px;border-radius:9999px;background:var(--destructive)"></span>blocked</span><span style="display:inline-flex;align-items:center;gap:.35rem;padding:.18rem .6rem;border-radius:9999px;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--warning) 18%,transparent);color:color-mix(in srgb,var(--warning) 80%,#fff)"><span style="width:6px;height:6px;border-radius:9999px;background:var(--warning)"></span>testing</span>
</div></div></body></html>
