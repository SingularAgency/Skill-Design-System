<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div class="col" style="gap:9px"><span class="eyebrow">Status · semantic · not brand-tinted</span>
<div class="row" style="gap:14px">
  <div class="col" style="gap:5px;align-items:center"><div class="swatch" style="width:96px;height:46px;background:#16A34A"></div><span class="lbl">success</span><span class="lbl" style="opacity:.6">#16A34A</span></div><div class="col" style="gap:5px;align-items:center"><div class="swatch" style="width:96px;height:46px;background:#D97706"></div><span class="lbl">warning</span><span class="lbl" style="opacity:.6">#D97706</span></div><div class="col" style="gap:5px;align-items:center"><div class="swatch" style="width:96px;height:46px;background:#DC2626"></div><span class="lbl">destructive</span><span class="lbl" style="opacity:.6">#DC2626</span></div><div class="col" style="gap:5px;align-items:center"><div class="swatch" style="width:96px;height:46px;background:#1741e8"></div><span class="lbl">info</span><span class="lbl" style="opacity:.6">#1741e8</span></div>
</div></div></body></html>
