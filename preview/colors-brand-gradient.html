<!doctype html><html class="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);padding:22px 26px;font-family:var(--font-display)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column}
  .swatch{border-radius:10px;border:1px solid rgb(255 255 255/.08)}
  .mono{font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted-foreground);font-family:var(--font-mono)}
  
</style></head><body>
<div class="col" style="gap:10px"><span class="eyebrow eyebrow--brand">Signature gradient · 135° blue→cyan</span>
<div class="swatch" style="height:64px;background-image:var(--gradient-primary)"></div>
<div class="row" style="gap:10px">
  <span class="mono lbl">#4567ed</span><span class="lbl">→</span><span class="mono lbl">#22d3ee</span>
  <span class="lbl" style="margin-left:auto">CTAs · accent text · active fills · logo chip</span>
</div></div></body></html>
