<!doctype html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singular Stories — Web-app UI kit</title>
<link rel="icon" href="../../assets/logos/singular-favicon-256.png">

<!-- DS token engine: core + app (navy) brand + utilities + brand background -->
<link rel="stylesheet" href="../../tokens/core.css">
<link rel="stylesheet" href="../../tokens/brand-app.css">
<link rel="stylesheet" href="../../tokens/core-utilities.css">
<link rel="stylesheet" href="../../backgrounds/brand-background.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--background); color: var(--foreground);
    -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
  table tbody tr.row:hover td { background: var(--accent); }
  input:focus, button:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  kbd { background: color-mix(in srgb, var(--foreground) 8%, transparent); padding: .05rem .3rem; border-radius: 4px; }
  @keyframes sm-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
  @media (max-width: 880px) {
    main { padding: 1.5rem 1.25rem 3rem !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
